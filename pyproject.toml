[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen"
version = "0.1.0"
description = "Multi-modal, Sun angle and scale invariant image correspondence using Chandrayaan-2 optical images"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.0",
    "torchvision>=0.15",
    "scipy>=1.11",
    "scikit-image>=0.21",
    "rasterio>=1.3",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "kornia>=0.7",
    "lightglue>=0.0.4",
    "gdal>=3.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit"
]

[project.scripts]
lumen = "lumen.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
